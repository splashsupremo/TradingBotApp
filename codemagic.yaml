workflows:
  build-android:
    name: Build Trading Bot APK
    max_build_duration: 60
    environment:
      android_signing:
        - keystore_reference
      vars:
        JAVA_VERSION: 17
    scripts:
      - name: Build APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
