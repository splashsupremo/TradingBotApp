
plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    compileSdk 31
    defaultConfig {
        applicationId "com.example.tradingbot"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "armeabi-v7a", "x86"
        }
        python {
            pip {
                install "requests"
                install "websocket-client"
                install "numpy"
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
}
